[tool.poetry]
name = "meeting-connectors"
version = "0.1.0"
description = "Bridge between browser-joined meetings and a Streaming Avatar Agent"
authors = ["Platform Engineering"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
websockets = "^17.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
dependency-injector = "^4.42.0"
structlog = "^24.4.0"
orjson = "^3.10.0"

# A real browser via Playwright is how **every** connector publishes and observes a meeting:
# `google_meet` (Google's Media API is receive-only, so there is no server-side way in), and
# `zoom_web`/`teams_web`, which both drive the same `PlaywrightDriver`/`build_launch_plan`
# (`connectors/google_meet/automation/driver.py`, `connectors/google_meet/browser/launcher.py`
# — imported across connectors rather than duplicated, see the docstring on that coupling in
# each `session.py`).
#
# **A hard dependency, and now unconditionally so.** It was once a `google-meet` extra, then a
# hard dependency that the two SDK-based connectors (Zoom Meeting SDK, Teams Graph app-hosted
# media) could technically run without. Both of those have been removed, so there is no code
# path left that does not need a browser. `automation/driver.py` still imports it lazily and
# raises `PlaywrightUnavailableError` naming the install command, so a missing *browser binary*
# (`playwright install chromium` — a separate step this dependency does not cover) still fails
# with a clear, actionable error rather than a bare stack trace.
playwright = "^1.49.0"

[tool.poetry.group.dev.dependencies]
# For the test suite's `httpx.AsyncClient` against the FastAPI app. Nothing in `src/` calls
# out over HTTP any more — the one module that did was the Zoom RTMS start trigger, which
# went with the Meeting-SDK connector — so this is a dev dependency again.
httpx = "^0.27.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Design docs are prose, and 004 is a FROZEN wire spec. A formatter reaching into
# their fenced code blocks must never be able to alter a frozen contract.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "TID",      # tidy imports
    "PTH",      # use pathlib
    "RET",      # return consistency
    "ARG",      # unused arguments
]
ignore = [
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S101"]
# calendar-orchestrator is a separate service with its own venv and pytest config, so its
# tests need the same allowances spelled out again — the pattern above is anchored at the
# repo root and does not reach them.
"calendar-orchestrator/tests/**" = ["ARG001", "ARG002", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (a browser, avatar agent, ffmpeg)",
]
