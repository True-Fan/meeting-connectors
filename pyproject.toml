[tool.poetry]
name = "meeting-connectors"
version = "0.1.0"
description = "Bridge between Zoom meetings and a Streaming Avatar Agent"
authors = ["Platform Engineering"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
websockets = "^17.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
dependency-injector = "^4.42.0"
structlog = "^24.4.0"
orjson = "^3.10.0"

# Google Meet only, and optional for that reason. Google publishes no server-side way to
# send media into a Meet conference — its Media API is receive-only and says so — so the
# avatar has to join as a real signed-in browser. Zoom and Teams reach their platforms
# through SDKs and never touch this.
#
# An extra rather than a hard dependency so a Zoom-only or Teams-only deployment does not
# pull a ~150 MB browser it will never launch. `connectors/google_meet/automation/driver.py`
# imports it lazily and raises PlaywrightUnavailableError naming the install command, so a
# missing browser is a clear error at session start rather than an ImportError at boot.
playwright = { version = "^1.49.0", optional = true }

[tool.poetry.extras]
google-meet = ["playwright"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Design docs are prose, and 004 is a FROZEN wire spec. A formatter reaching into
# their fenced code blocks must never be able to alter a frozen contract.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "TID",      # tidy imports
    "PTH",      # use pathlib
    "RET",      # return consistency
    "ARG",      # unused arguments
]
ignore = [
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S101"]
# calendar-orchestrator is a separate service with its own venv and pytest config, so its
# tests need the same allowances spelled out again — the pattern above is anchored at the
# repo root and does not reach them.
"calendar-orchestrator/tests/**" = ["ARG001", "ARG002", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (Zoom, avatar agent, ffmpeg)",
]
