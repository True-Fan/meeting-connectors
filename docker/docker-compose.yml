# M1: the bridge alone.
#
# Deliberately not present yet:
#   mock-avatar  -> M3, alongside the avatar client
#   zoom-sidecar -> M5, alongside the publisher
#
# The sidecar UDS lives on a shared volume so the two containers can meet without
# exposing a network port for media.

name: meeting-connectors

services:
  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      MC_ENV: ${MC_ENV:-local}
      MC_SIDECAR__UDS_PATH: /run/meeting-connectors/sidecar.sock
    volumes:
      - sidecar-ipc:/run/meeting-connectors
    restart: unless-stopped

volumes:
  sidecar-ipc:
